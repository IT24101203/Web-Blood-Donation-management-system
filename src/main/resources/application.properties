spring.application.name=blood-donation

# Server Configuration
server.port=8080

# =========================
# SQL Server Database (Persistent)
# =========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BloodDonationSystem;encrypt=false
spring.datasource.username=sa
spring.datasource.password=789
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Disable H2 console when using SQL Server
spring.h2.console.enabled=false

# Disable Flyway (no migrations provided)
spring.flyway.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Security Configuration - Disable Spring Security completely
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.blooddonation=DEBUG
